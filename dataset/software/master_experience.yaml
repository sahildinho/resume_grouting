      # PROJECT 1.6: Dynamic Pricing AI Agent & Causal Inference Platform for Spare Parts MRP Optimization
      - project_name: "AI-Powered Dynamic Pricing & Spare Parts MRP Optimization Platform"
        project_id: "mahindra_dynamic_pricing_finance_ai"
        domains: ["data_science", "agentic_ai", "causal_inference", "finance_analytics", "pricing_optimization", "mlops"]

        executive_summary: >
          Architected and deployed an end-to-end AI-powered Dynamic Pricing and Maximum Retail Price (MRP)
          Optimization platform for automotive spare parts. Combined econometric panel modeling, causal
          inference (Microsoft EconML Causal Forests, 2SLS, Difference-in-Differences), and a LangGraph-orchestrated
          Agentic AI assistant to quantify SKU-level customer price elasticity, simulate financial impact
          (volume, revenue, gross margin, profit), and automate data-backed pricing decisions.

        business_context:
          problem_statement: >
            Spare parts MRP revisions were historically dictated by qualitative business intuition rather than
            quantitative causal analysis. Pricing leadership lacked tools to evaluate counterfactual questions
            (e.g., "If we raise the MRP of a brake pad by 8%, what is the expected demand elasticity and margin delta?"),
            risking margin erosion, inventory accumulation, dealer dissatisfaction, and customer churn.
          stakeholders_and_users: >
            Central Pricing Committee, Finance Leadership, Spare Parts Business Unit, Aftermarket Commercial Leads,
            and Category Product Managers.
          scale_and_volume: >
            Constructed monthly panel datasets (Part ID × Month) covering thousands of spare part SKUs, consolidating
            primary and secondary sales, realized prices, production costs, competitor indices, dealer inventory,
            and vehicle population telemetry.
          budget_and_resources: >
            Deployed on enterprise cloud infrastructure with FastAPI microservices, Azure OpenAI / LLM services,
            MongoDB, PostgreSQL, and containerized Docker runtimes.
          business_impact: >
            Automated price sensitivity estimation across thousands of spare parts, slashed pricing scenario analysis
            time from days of manual modeling to minutes via conversational AI, and prevented suboptimal price hikes
            via confidence-aware financial impact scoring.

        architecture_and_workflow:
          step_1_historical_panel_engineering: >
            Aggregated and cleaned longitudinal transactional records into a standardized panel dataset at Part ID × Month
            level, integrating primary/secondary sales volumes, list MRP, realized invoice prices, bill-of-materials costs,
            competitor price benchmark indices, active vehicle population, and dealer inventory ratios.
          step_2_feature_engineering_and_log_transforms: >
            Engineered econometric log-log variables (ln(Qty), ln(Price)) for direct constant-elasticity interpretation,
            rolling demand averages, price revision event indicator flags, inventory-to-sales ratios, and categorical
            product hierarchies.
          step_3_fixed_effects_panel_regression: >
            Estimated baseline econometric panel regression with entity (part-level) and time fixed effects:
            ln(Qty) = β0 + β1*ln(Price) + β2*Competition + Seasonality + Part_FE + Time_FE, controlling for unobserved
            time-invariant part heterogeneity, macro trends, and seasonal automotive demand patterns.
          step_4_causal_inference_and_endogeneity: >
