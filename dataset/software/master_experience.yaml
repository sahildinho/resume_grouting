            Advanced beyond pooled elasticities by training Microsoft EconML Causal Forests to discover non-linear Heterogeneous
            Treatment Effects (HTE) across individual SKUs and part categories, producing SKU-specific price elasticities
            paired with rigorous statistical confidence intervals.
          step_6_multi_scenario_simulation_engine: >
            Constructed a deterministic financial simulation engine that takes candidate price revisions (e.g., +8%),
            applies part-level causal elasticity, and projects counterfactual volume changes, top-line revenue shifts,
            gross margin expansion, and bottom-line profit deltas.
          step_7_agentic_ai_orchestration: >
            Engineered an Agentic AI assistant (LangGraph + Azure OpenAI) with specialized tool calling: Planner Agent
            parses business queries, Data Retrieval Agent queries transactional histories, Elasticity Agent invokes trained
            EconML models, Simulation Tool executes financial projections, and Explanation Agent generates executive summaries.
          step_8_composite_impact_scoring: >
