      # PROJECT 1.5: PRITHVI: Wheel Force Transducer (WFT) AI Twin & Virtual Sensing Platform
      - project_name: "PRITHVI: Wheel Force Transducer (WFT) AI Twin & Virtual Sensing Platform"
        project_id: "mahindra_prithvi_wft_ai_twin"
        domains: ["automotive_engineering", "data_science", "deep_learning", "physics_informed_ai", "time_series", "mlops", "cae"]

        executive_summary: >
          Architected and developed "PRITHVI: WFT AI Twin" (Predictive Road-load Intelligence for Tyre Hub & Vehicle
          force Inference), an industry-first physics-informed digital twin and virtual sensing platform at Mahindra
          Research Valley (MRV). Leveraged deep sequence learning (Temporal Convolutional Networks - TCN), symbolic
          regression (PySR / SINDy), nonlinear vehicle dynamics modeling (Pacejka Magic Formula), and gradient-boosted
          ensembles (XGBoost) to accurately predict 24 wheel-center outputs (Fx, Fy, Fz forces and Mx, My, Mz moments
          across all 4 wheels: LF, RF, LR, RR) directly from non-intrusive on-board sensors, eliminating physical
          Wheel Force Transducer (WFT) hardware bottlenecks.

        business_context:
          problem_statement: >
            Wheel Force Transducers (WFT) are multi-million dollar, fragile physical sensor assemblies in extremely
            scarce supply, shared across all vehicle programs at MRV. Physical durability testing required up to 12 weeks
            per test iteration across proving grounds (ruts, potholes, pavé, twist tracks), creating critical resource
            bottlenecks that delayed chassis fatigue simulations, suspension design validation, and multi-revision sign-offs.
          stakeholders_and_users: >
            Materials & Durability Group (MDG), Vehicle Dynamics & Suspension Engineering Teams, CAE Fatigue Simulation
            Leads, and Proving Ground Testing Divisions.
          scale_and_volume: >
            Ingested high-frequency multi-channel sensor telemetry across 7 distinct proving ground track environments
            (Longwave, Twist, High Frequency, Pavé 1A, Pavé 1B, Pavé 2A, Pavé 2B) and diverse vehicle lines (M-Series,
            U-Series, Z-Series) under laden and unladen conditions, inferring 24 continuous force and moment channels.
          budget_and_resources: >
            Deployed on Google Cloud Platform (GCP) with Dockerized microservices, Cloud SQL, Cloud Storage, a 7-track
            Model Registry, VPC/Load Balancers, and dedicated GPU training instances.
          business_impact: >
            Cut testing timelines by 60% (from 12 weeks down to 4 weeks), completely eliminated physical WFT sensor
            dependencies for Run 2 and Run 3 vehicle testing cycles, achieved 95% accuracy on vertical forces (Fz)
            with NRMSE down to 1.6%–3.5%, and achieved 88% accuracy on lateral forces (Fy) with up to 81% error reduction
            on hybrid architectures.

        architecture_and_workflow:
          step_1_multivariate_telemetry_ingestion: >
            Ingested high-frequency time-series from standard on-board accelerometers, gyroscopes, wheel speed sensors,
            suspension travel potentiometers, steering angles, and vehicle CAN bus signals across 7 proving ground track terrains.
          step_2_physics_informed_feature_engineering: >
            Modeled nonlinear suspension dynamics and damper/bumpstop characterization data using Sparse Identification
            of Nonlinear Dynamics (SINDy) and Symbolic Regression via Genetic Programming (PySR) to discover analytical
            closed-form equations for damper force-velocity (F-V) and bumpstop force-displacement (F-D). Integrated
            Pacejka Magic Formula tire models for lateral force (Fy) mapping, Kinematics & Compliance (K&C) matrices,
            unsprung mass dynamics, and jerk (d³x/dt³).
          step_3_temporal_convolutional_network_tcn: >
            Implemented deep Temporal Convolutional Networks (TCN) featuring dilated causal convolutions with exponentially
            growing receptive fields and residual connections to capture long-horizon suspension memory and high-frequency
            transients without requiring manual lead/lag feature crafting.
          step_4_latent_feature_map_fusion: >
            Extracted compact, high-dimensional latent temporal feature maps per wheel-end from the final TCN layer and
            fused them with static vehicle parameters (curb weight, wheelbase, track width, roll/pitch centers) and operational states.
          step_5_gradient_boosted_regression_pipeline: >
            Trained specialized XGBoost regression heads on the fused temporal-physical representation to independently
            infer 3-axis forces (Fx, Fy, Fz) and 3-axis moments (Mx, My, Mz) across Left-Front (LF), Right-Front (RF),
            Left-Rear (LR), and Right-Rear (RR) wheel ends.
          step_6_feature_selection_and_model_optimization: >
            Applied systematic feature importance pruning, reducing lateral force features from 324 to 209 and pruning
            100+ vertical force features, accelerating convergence and slashing NRMSE by up to 81% in critical wheel-ends.
          step_7_cloud_mlops_and_inference_serving: >
            Deployed the sequential multi-track inference pipeline on Google Cloud Platform (GCP) with containerized FastAPI
            microservices, automated batch scoring on Cloud Storage time-series files, Cloud SQL logging, and a 7-track Model Registry.

        tech_stack:
          deep_learning_and_time_series: ["PyTorch", "Temporal Convolutional Networks (TCN)", "Dilated Causal Convolutions", "Multivariate Time Series"]
          physics_informed_and_symbolic_ai: ["PySR (Symbolic Regression / Genetic Programming)", "SINDy (Sparse Identification of Nonlinear Dynamics)", "Pacejka Magic Formula Tire Model", "Damper F-V & Bumpstop F-D Dyno Models"]
          machine_learning_and_stats: ["XGBoost", "Scikit-Learn", "NumPy", "Pandas", "SciPy", "Feature Importance & Pruning"]
          cloud_and_mlops: ["Google Cloud Platform (GCP)", "Docker", "Cloud Storage", "Cloud SQL", "Model Registry", "FastAPI"]
          domain_engineering: ["Wheel Force Transducers (WFT)", "Suspension Kinematics & Compliance (K&C)", "Road Load Data Acquisition (RLDA)", "Durability & Fatigue Load Cases"]

        challenges_and_solutions:
          - challenge: "Severe non-linearities and hysteresis in shock absorber damping and bumpstop impact during rough road transitions."
            solution: "Applied SINDy and PySR symbolic regression on physical component dyno characterization data, extracting closed-form analytical equations (F(v) and F(d)) to inject domain-accurate physical inductive bias into the ML pipeline."
          - challenge: "High-dimensional multi-sensor time-series caused feature explosion (324+ features per wheel-end) and overfitting on track-specific maneuvers."
            solution: "Replaced manual lead/lag feature matrices with Dilated Causal TCN feature representations and pruned over 100 redundant collinear features, cutting NRMSE by up to 81% on lateral force models."
          - challenge: "Generalizing load inference across drastically different proving ground tracks (Longwave sinusoidal waves vs. high-impact pavé cobbles vs. torsional twist tracks)."
            solution: "Engineered a sequential track-segmented inference architecture with dedicated model ensembles registered in a GCP Model Registry for each of the 7 proving ground environments."

